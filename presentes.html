        :root {
            --bg-color: #000000;
            --gold-primary: #d4c2a5;
            --gold-light: #e6dcc6;
            --gold-dark: #a8936f;
            --text-light: #fcfaf7;
            --font-serif: 'Cinzel', serif;
            --font-sans: 'Montserrat', sans-serif;
            --font-accent: 'Alex Brush', cursive;
            --glass: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(212, 194, 165, 0.2);

            --bg: var(--bg-color);
            --surface: var(--glass);
            --fg: var(--text-light);
            --muted: rgba(252, 250, 247, 0.6);
            --border: var(--glass-border);
            --accent: var(--gold-primary);
            --font-display: var(--font-serif);
            --font-body: var(--font-sans);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 4px;
        }

        body {
            min-height: 100vh;
            background: var(--bg);
            color: var(--fg);
            font-family: var(--font-body);
            line-height: 1.6;
            overflow-x: hidden;
        }



        .skip-link {
            position: fixed;
            top: 1rem;
            left: 1rem;
            z-index: 1000;
            transform: translateY(-140%);
            background: var(--fg);
            color: var(--bg-color);
            padding: 0.8rem 1rem;
            border-radius: 999px;
            text-decoration: none;
            font-size: 0.8rem;
        }

        .skip-link:focus {
            transform: translateY(0);
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        header {
            position: relative;
            z-index: 1;
            padding: 3rem 5vw 2rem;
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            align-items: center;
        }

        .brand,
        .back-link {
            color: var(--fg);
            text-decoration: none;
        }

        .brand {
            font-family: var(--font-display);
            font-size: 2rem;
        }

        .back-link {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            opacity: 0.68;
        }

        main {
            position: relative;
            z-index: 1;
            padding: 4rem 5vw 7rem;
        }

        .intro {
            max-width: 920px;
            margin-bottom: 4rem;
        }

        .eyebrow {
            display: block;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.24em;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 1.3rem;
        }

        h1 {
            font-family: var(--font-display);
            font-weight: 300;
            font-size: clamp(3.5rem, 10vw, 8rem);
            line-height: 0.92;
            margin-bottom: 2rem;
        }

        .intro p {
            max-width: 660px;
            color: var(--muted);
            font-size: 1.1rem;
        }

        .intro-note {
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            margin-top: 1.4rem;
            padding: 0.8rem 1rem;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: rgba(255,255,255,0.04);
            color: var(--gold-light);
            font-size: 0.82rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .gifts-page-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            justify-content: center;
        }
        
        .gifts-page-grid > * {
            flex: 1 1 280px;
            max-width: 340px;
        }

        .gifts-sections {
            display: block;
        }

        .gifts-section {
            margin-top: 2.5rem;
        }

        .gifts-section + .gifts-section {
            margin-top: 3rem;
        }

        .gifts-section-head {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 1.4rem;
        }

        .gifts-section-head h2 {
            font-family: var(--font-display);
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            font-weight: 400;
            line-height: 1;
        }

        .gifts-section-head p {
            color: var(--muted);
            max-width: 640px;
            font-size: 0.95rem;
        }

        .gifts-section-tag {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            padding: 0.45rem 0.8rem;
            border-radius: 999px;
            border: 1px solid var(--border);
            color: var(--gold-light);
            background: rgba(255,255,255,0.04);
            font-size: 0.72rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .category-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 0.7rem;
            margin-bottom: 2rem;
        }

        .category-filters button {
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.045);
            border-radius: 999px;
            color: var(--gold-light);
            padding: 0.8rem 1rem;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            cursor: pointer;
        }

        .category-filters button.is-active {
            background: var(--gold-primary);
            border-color: var(--gold-primary);
            color: var(--bg-color);
            font-weight: 700;
        }

        .gift-item {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
            transition: transform 0.2s ease, border-color 0.2s ease;
            transform: translateZ(0);
            will-change: transform;
        }

        .gift-item:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
        }

        .gift-photo {
            aspect-ratio: 16 / 10;
            border-radius: 14px;
            background: rgba(91,26,45,0.42);
            display: flex;
            align-items: flex-end;
            justify-content: flex-start;
            color: var(--fg);
            font-family: var(--font-display);
            font-size: clamp(1.1rem, 2vw, 1.7rem);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            text-align: left;
            padding: 0.85rem 0.85rem 0.75rem;
            min-height: 120px;
            overflow: hidden;
            position: relative;
        }

        .gift-photo img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .gift-photo::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(6,6,6,0.85) 0%, rgba(6,6,6,0.2) 50%, rgba(6,6,6,0.05) 100%);
            z-index: 1;
        }

        .gift-photo-icon {
            position: relative;
            z-index: 3;
            width: 42px;
            height: 42px;
            display: grid;
            place-items: center;
            margin: 0 0 0.75rem;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.22);
            font-size: 1.1rem;
        }

        .gift-photo-copy {
            position: relative;
            z-index: 3;
        }

        .gift-photo span {
            display: block;
            text-shadow: 0 10px 22px rgba(0,0,0,0.35);
            font-size: 1.05rem;
            line-height: 1;
        }

        .gift-photo small {
            display: block;
            margin-top: 0.35rem;
            color: rgba(252, 250, 247, 0.82);
            font-size: 0.72rem;
            letter-spacing: 0.14em;
        }

        .gift-category {
            color: var(--accent);
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            font-weight: 700;
        }

        .gift-item h2 {
            font-family: var(--font-display);
            font-weight: 400;
            font-size: 1.5rem;
            line-height: 1.05;
        }

        .gift-item p {
            color: var(--muted);
        }

        .gift-price {
            color: var(--accent);
            font-weight: 700;
            font-size: 1.1rem;
            margin-top: auto;
        }

        .custom-amount {
            width: 100%;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.05);
            color: var(--fg);
            border-radius: 14px;
            padding: 0.95rem 1rem;
            font: inherit;
        }

        .gift-item button {
            border: 1px solid rgba(212, 175, 55, 0.65);
            border-radius: 999px;
            background: rgba(8, 8, 8, 0.72);
            color: var(--gold-light);
            padding: 1rem 1.2rem;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            cursor: pointer;
            transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease;
        }

        .gift-item button:hover {
            background: var(--gold-primary);
            color: var(--bg-color);
            transform: translateY(-2px);
        }

        .gift-item button:disabled {
            opacity: 0.62;
            cursor: wait;
        }

        .status {
            min-height: 1.4rem;
            margin-top: 2rem;
            color: var(--muted);
        }

        .modal {
            position: fixed;
            inset: 0;
            z-index: 10000;
            display: grid;
            place-items: center;
            padding: 1.5rem;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
        }

        .modal[hidden] {
            display: none;
        }

        .modal-card {
            width: min(100%, 520px);
            background: #0a0a0a;
            border: 1px solid var(--border);
            color: var(--fg);
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 0 30px 100px rgba(0,0,0,0.5);
        }

        .modal-card h2 {
            font-family: var(--font-display);
            font-size: 2.4rem;
            font-weight: 400;
            line-height: 1;
            margin-bottom: 1rem;
        }

        .modal-card p {
            color: var(--muted);
            margin-bottom: 1rem;
        }

        .modal-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-top: 1.5rem;
        }

        .modal-actions button {
            border: 0;
            border-radius: 999px;
            padding: 0.9rem 1.1rem;
            cursor: pointer;
        }

        .modal-actions .confirm {
            background: var(--fg);
            color: #0a0a0a;
            font-weight: 600;
        }

        .modal-actions .cancel {
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--border);
        }

        @media (max-width: 680px) {
            header {
                align-items: flex-start;
                flex-direction: column;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

            'maquina-de-cafe': 'assets/presentes/maquina-cafe.jpg',
            'televisao': 'assets/presentes/televisao-real.jpg',
            'robo-aspirador-de-casa': 'assets/presentes/robo-aspirador.jpg',
            'noiva-sempre-certa': 'assets/presentes/noiva-sempre-certa.jpg',
            'vestido-branco': 'assets/presentes/vestido-branco.jpg',
            'fila-do-buffet': 'assets/presentes/fila-buffet.jpg',
            'anti-briga-cobertor': 'assets/presentes/cobertor.jpg',
            'lenco-maquiagem': 'assets/presentes/maquiagem-lenco.jpg',
            'impedir-buque': 'assets/presentes/buque.jpg',
            'jogar-buque': 'assets/presentes/buque-direcao.jpg',
            'terapia-casal': 'assets/presentes/terapia-casal.jpg'
        };

        const giftImagePositions = {
            'jogo-de-jantar': 'center',
            'jogo-de-talheres-dourado': 'center',
            'faqueiro': 'top',
            'edredom-queen': 'center',
            'jogo-de-cama': 'center',
            'noiva-sempre-certa': 'center',
            'vestido-branco': 'center top',
            'fila-do-buffet': 'center',
            'anti-briga-cobertor': 'center',
            'lenco-maquiagem': 'center',
            'impedir-buque': 'center',
            'jogar-buque': 'center',
            'terapia-casal': 'center'
        };

        const grid = document.querySelector('#gifts-grid');
        const filters = document.querySelector('#category-filters');
        const status = document.querySelector('#status');
        const modal = document.querySelector('#summary-modal');
        const summaryTitle = document.querySelector('#summary-title');
        const summaryDescription = document.querySelector('#summary-description');
        const summaryPrice = document.querySelector('#summary-price');
        const summaryConfirm = document.querySelector('#summary-confirm');
        const summaryCancel = document.querySelector('#summary-cancel');
        let activeCategory = 'Todos';
        let pendingGift = null;

        function formatPrice(value) {
            return value.toLocaleString('pt-BR', {
                style: 'currency',
                currency: 'BRL'
            });
        }

        function renderFilters() {
            const categories = ['Todos', ...new Set(gifts.map(gift => gift.category))];
            filters.innerHTML = categories.map(category => `
                <button type="button" class="${category === activeCategory ? 'is-active' : ''}" data-category="${category}">${category}</button>
            `).join('');
        }





        function renderGiftCard(gift) {
            return `
                <article class="gift-item">
                    <div class="gift-photo" aria-hidden="true">
                        ${giftImages[gift.id] ? `<img src="${giftImages[gift.id]}" loading="lazy" alt="" style="object-position: ${giftImagePositions[gift.id] || 'center'};">` : ''}
                        <div class="gift-photo-copy">
                            <div class="gift-photo-icon">${giftIcons[gift.id] || '&#127873;'}</div>
                            <span>${gift.visual}</span>
                            <small>${gift.title}</small>
                        </div>
                    </div>
                    <span class="gift-category">${gift.category}</span>
                    <h2>${gift.title}</h2>
                    <p>${gift.description}</p>
                    ${gift.custom
                        ? '<input class="custom-amount" type="number" min="1" step="1" placeholder="Valor em R$" aria-label="Valor do presente livre">'
                        : `<div class="gift-price">${formatPrice(gift.price)}</div>`
                    }
                    <button type="button" data-gift-id="${gift.id}">Comprar presente</button>
                </article>
            `;
        }

        function renderGiftSection(title, note, tag, items) {
            if (!items.length) return '';
            return `
                <section class="gifts-section">
                    <div class="gifts-section-head">
                        <div>
                            <div class="gifts-section-tag">${tag}</div>
                            <h2>${title}</h2>
                        </div>
                        <p>${note}</p>
                    </div>
                    <div class="gifts-page-grid">
                        ${items.map(renderGiftCard).join('')}
                    </div>
                </section>
            `;
        }

        renderGifts = function() {
            const visibleGifts = activeCategory === 'Todos'
                ? gifts
                : gifts.filter(gift => gift.category === activeCategory);

            if (activeCategory !== 'Todos') {
                grid.innerHTML = visibleGifts.map(renderGiftCard).join('');
                return;
            }

            const funnyCategory = 'Presentes divertidos';
            const freeCategory = 'Valor livre';
            const funnyGifts = gifts.filter(gift => gift.category === funnyCategory);
            const freeGifts = gifts.filter(gift => gift.category === freeCategory);
            const realGifts = gifts.filter(gift => gift.category !== funnyCategory && gift.category !== freeCategory);

            grid.innerHTML = [
                renderGiftSection(
                    'Presentes reais',
                    'Itens para o novo lar e para a rotina do casal.',
                    'Lista principal',
                    realGifts
                ),
                renderGiftSection(
                    'Presentes divertidos',
                    'Brincadeiras escolhidas para render risada sem virar bagunca.',
                    'Extra',
                    funnyGifts
                ),
                renderGiftSection(
                    'Valor livre',
                    'Para quem prefere contribuir com qualquer quantia.',
                    'Livre',
                    freeGifts
                )
            ].join('');
        }

        function openSummary(gift, amount, button) {
            pendingGift = { gift, amount, button };
            summaryTitle.textContent = gift.title;
            summaryDescription.textContent = gift.description;
            summaryPrice.textContent = gift.custom ? formatPrice(amount) : formatPrice(gift.price);
            modal.hidden = false;
            summaryConfirm.focus();
        }

        function closeSummary() {
            modal.hidden = true;
            if (pendingGift?.button) {
                pendingGift.button.focus();
            }
        }

        function checkout(giftId, amount, button) {
            button.disabled = true;
            button.textContent = 'Abrindo checkout...';
            
            let url = `checkout.html?giftId=${giftId}`;
            if (amount !== undefined && amount !== null && !isNaN(amount)) {
                url += `&amount=${amount}`;
            }
            window.location.href = url;
        }

        filters.addEventListener('click', (event) => {
            const button = event.target.closest('button[data-category]');
            if (!button) return;
            activeCategory = button.dataset.category;
            renderFilters();
            renderGifts();
        });

        grid.addEventListener('click', (event) => {
            const button = event.target.closest('button[data-gift-id]');
            if (!button) return;

            const card = button.closest('.gift-item');
            const giftId = button.dataset.giftId;
            const gift = gifts.find(item => item.id === giftId);
            const amountInput = card.querySelector('.custom-amount');
            const amount = amountInput ? Number(amountInput.value) : undefined;

            if (amountInput && (!Number.isFinite(amount) || amount < 1)) {
                status.textContent = 'Informe um valor livre de pelo menos R$ 1,00.';
                amountInput.focus();
                return;
            }

            openSummary(gift, amount, button);
        });

        summaryConfirm.addEventListener('click', () => {
            if (!pendingGift) return;
            checkout(pendingGift.gift.id, pendingGift.amount, pendingGift.button);
            modal.hidden = true;
        });

        summaryCancel.addEventListener('click', closeSummary);
        modal.addEventListener('click', (event) => {
            if (event.target === modal) closeSummary();
        });
        window.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && !modal.hidden) closeSummary();
        });

        renderFilters();
        renderGifts();


    </script>
</body>
</html>
